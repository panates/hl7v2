name: Release
on:
  # Can be run manually
  workflow_dispatch:
    inputs:
      skip-tests:
        description: Skip test
        type: boolean
        default: false

  # on git push
  push:
    branches:
      - main

# Only one run at a time
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Answers "did this commit arrive through a pull request, and from which branch?" - which a job's
  # own `if:` cannot ask, since a push payload says nothing about a pull request.
  source:
    uses: panates/github-actions/.github/workflows/pr-source.yaml@v3
    permissions:
      contents: read
      pull-requests: read

  test:
    needs: source
    permissions:
      contents: read
    # A merge from dev was already tested on dev.
    if: >
      !contains(github.event.head_commit.message, 'no-release') &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.skip-tests != 'true') ||
        (
          github.event_name == 'push' &&
          !contains(github.event.head_commit.message, 'no-test') &&
          needs.source.outputs.head-ref != 'dev'
        )
      )
    uses: ./.github/workflows/test.yml

  release:
    needs: [source, test]
    # `always()` because `needs` alone blocks this whenever `test` is skipped, which is a normal path.
    if: >
      always() && !cancelled() &&
      needs.source.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      !contains(github.event.head_commit.message, 'no-release')
    uses: panates/github-actions/.github/workflows/node-release.yaml@v3
    # Declared on the calling job, because that is what governs a reusable workflow's permissions.
    permissions:
      id-token: write
      contents: write
    secrets:
      # No PERSONAL_ACCESS_TOKEN: no manifest here carries a private scope and there is no .npmrc,
      # so it had nothing to authenticate.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
