name: Release
on:
  # Can be run manually
  workflow_dispatch:
    inputs:
      skip-tests:
        description: Skip test
        type: boolean
        default: false

  # on git push
  push:
    branches:
      - main

# Only one run at a time
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Answers "did this commit arrive through a pull request, and from which branch?" - which a job's
  # own `if:` cannot ask, since a push payload says nothing about a pull request.
  source:
    uses: panates/github-actions/.github/workflows/pr-source.yaml@v3
    permissions:
      contents: read
      pull-requests: read

  test:
    needs: source
    permissions:
      contents: read
    # A merge from dev was already tested on dev.
    if: >
      !contains(github.event.head_commit.message, 'no-release') &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.skip-tests != 'true') ||
        (
          github.event_name == 'push' &&
          !contains(github.event.head_commit.message, 'no-test') &&
          needs.source.outputs.head-ref != 'dev'
        )
      )
    uses: ./.github/workflows/test.yml

  # Sends the released code's coverage to Coveralls under main: the report of dev's test run of the
  # merged commit, or of this run's own test job. It only warns when it finds no report.
  coverage:
    needs: [source, test]
    if: >
      always() && !cancelled() &&
      needs.source.result == 'success' &&
      (needs.test.result == 'success' ||
       (needs.test.result == 'skipped' && needs.source.outputs.head-ref == 'dev'))
    uses: panates/github-actions/.github/workflows/coverage-publish.yaml@v3
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      pr-number: ${{ needs.source.outputs.head-ref == 'dev' && needs.source.outputs.pr-number || '' }}

  release:
    needs: [source, test]
    # `always()` because `needs` alone blocks this whenever `test` is skipped, which is a normal path.
    if: >
      always() && !cancelled() &&
      needs.source.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      !contains(github.event.head_commit.message, 'no-release')
    uses: panates/github-actions/.github/workflows/node-release.yaml@v3
    # No secrets: npm publishing uses Trusted Publishing (OIDC, the id-token permission), and no
    # manifest here carries a private scope, so there is nothing for PERSONAL_ACCESS_TOKEN to authenticate.
    # Declared on the calling job, because that is what governs a reusable workflow's permissions.
    permissions:
      id-token: write
      contents: write
