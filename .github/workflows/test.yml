name: Test
on:
  # Can be called from other workflows
  workflow_call:

  # Can be run manually
  workflow_dispatch:

  # on git push
  push:
    branches-ignore:
      - main
    paths:
      - 'packages/*/src/**'
      - 'packages/*/test/**'
      # `packages/*/*` rather than a brace pattern: brace expansion is not in GitHub's filter set,
      # and a filter that misses a file means the tests quietly do not run.
      - 'packages/*/*'
      - '.mocharc.cjs'
      - '.c8rc.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/test.yml'

# Only one run per branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Whether a release runs the tests is decided once, in release.yml. In a `workflow_call`
    # `github.event_name` is the caller's event, so repeating that guard here would evaluate it twice.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !contains(github.event.head_commit.message, 'no-test')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [ '22', '23', '24' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: panates/gh-setup-node@v2
        with:
          node-version: ${{ matrix.node }}
          rman-version: '2'
          install: 'ci'

      # The preset's own commands, which replaced the `qc` script (`rman run lint && rman run check`).
      - name: Run qc tests
        run: |
          rman check
          rman lint
          rman format --check
          # The tests are type-checked too: they use the generated object types
          for p in hl7v2 net dictionary; do npx tsc -p packages/$p/test/tsconfig.json --noEmit; done

      - name: Run unit tests
        run: npm run citest
        env:
          NODE_OPTIONS: "--max_old_space_size=4096 --no-experimental-strip-types"

      - name: Send coverage to Coveralls
        uses: coverallsapp/github-action@v2
        # Run only once
        if: ${{ matrix.node == '22' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
