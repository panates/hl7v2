# This package is bundled with esbuild rather than compiled with the preset's `tsc -b`: the
# generated per-version dictionaries are minified into one `index.js`, and tsc emits only the
# declarations. The per-version declaration directories are dropped - nothing in the public
# types refers to them.
run:
  build:
    exec: node esbuild.mjs && tsc -b tsconfig-build.json --emitDeclarationOnly && rimraf ./build/2*
